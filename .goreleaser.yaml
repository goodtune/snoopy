version: 2

# There is no go.mod at the repository root (the Go code lives in server/),
# so the project name cannot be inferred.
project_name: snoopy

# Builds: the recorder (user service) and the attestor (root system service).
# Both are archived and packaged together (archives and nfpms list both ids).
builds:
  - id: snoopy
    dir: server
    main: .
    binary: snoopy
    env: &build_env
      - CGO_ENABLED=0
    flags: &build_flags
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: &build_ldflags
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    targets: &build_targets
      - linux_amd64
      - linux_arm64

  - id: snoopy-attest
    dir: server
    main: ./cmd/snoopy-attest
    binary: snoopy-attest
    env: *build_env
    flags: *build_flags
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: *build_ldflags
    targets: *build_targets

# Archive configuration for GitHub releases
archives:
  - id: default
    ids:
      - snoopy
      - snoopy-attest
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md
      - src: server/snoopy.service
        strip_parent: true
      - src: server/snoopy.conf.example
        strip_parent: true
      - src: server/snoopy-attest.service
        strip_parent: true
      - src: server/attest.conf.example
        strip_parent: true
      - src: docs/attestation.md
        strip_parent: true
      - assets/snoopy-500.jpg

# Linux packages (RPM and Debian)
nfpms:
  - id: snoopy-packages
    package_name: snoopy
    ids:
      - snoopy
      - snoopy-attest
    # e.g. snoopy-0.1.0-1.x86_64.rpm and snoopy_0.1.0_amd64.deb
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: GoodTune
    homepage: https://github.com/goodtune/snoopy
    maintainer: Gary Reynolds <gary@touch.asn.au>
    description: |
      Snoopy - Continuous screen recording and web-based streaming for GNOME-based Linux systems.
      Provides automated screencast recording in segments by interfacing with GNOME Shell's
      screencast D-Bus API, with real-time web streaming via HTTP Server-Sent Events (SSE).
      Includes snoopy-attest, an optional root service that attests to a KProxy network
      proxy that the screen is being recorded (not enabled by default).
    license: MIT
    section: utils
    formats:
      - rpm
      - deb
    bindir: /usr/bin

    # Package contents
    contents:
      # Binaries snoopy and snoopy-attest (included by default in bindir)

      # Systemd user unit for the recorder
      - src: server/snoopy.service
        dst: /usr/lib/systemd/user/snoopy.service
        file_info:
          mode: 0644

      # Systemd system unit for the attestor (not enabled by the package)
      - src: server/snoopy-attest.service
        dst: /usr/lib/systemd/system/snoopy-attest.service
        file_info:
          mode: 0644

      # Branding asset
      - src: assets/snoopy-500.jpg
        dst: /usr/share/snoopy/assets/snoopy-500.jpg
        file_info:
          mode: 0644

      # Example configuration (copy to /etc/snoopy/snoopy.conf or
      # ~/.config/snoopy/snoopy.conf)
      - src: server/snoopy.conf.example
        dst: /usr/share/doc/snoopy/snoopy.conf.example
        file_info:
          mode: 0644

      # Example attestor configuration (copy to /etc/snoopy/attest.conf)
      - src: server/attest.conf.example
        dst: /usr/share/doc/snoopy/attest.conf.example
        file_info:
          mode: 0644

      # Attestation design and admin guide
      - src: docs/attestation.md
        dst: /usr/share/doc/snoopy/attestation.md
        file_info:
          mode: 0644

      # Documentation
      - src: README.md
        dst: /usr/share/doc/snoopy/README.md
        file_info:
          mode: 0644

      # License
      - src: LICENSE
        dst: /usr/share/licenses/snoopy/LICENSE
        file_info:
          mode: 0644

    # Scripts
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh

    # Dependencies
    recommends:
      - ffmpeg

    # RPM-specific
    rpm:
      summary: Continuous screen recording with web streaming for GNOME
      compression: lzma

# Checksum configuration
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Snapshot configuration for non-tagged builds
snapshot:
  version_template: "{{ .Version }}-next"

# Changelog: disabled. Releases are created with
#   gh release create vX.Y.Z --generate-notes
# and GoReleaser (release.mode: append) appends the header below to those
# notes, so a GoReleaser changelog would duplicate them.
changelog:
  disable: true

# GitHub release configuration
release:
  github:
    owner: goodtune
    name: snoopy
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## Snoopy {{ .Version }}

    Continuous screen recording and web-based streaming for GNOME-based Linux systems.

    ### Installation

    #### Linux (RPM-based: RHEL/CentOS/Fedora)
    ```bash
    sudo dnf install https://github.com/goodtune/snoopy/releases/download/{{ .Tag }}/snoopy-{{ .Version }}-1.x86_64.rpm
    # Not enabled automatically; enable it for your user (or see the README)
    systemctl --user enable --now snoopy.service
    ```

    #### Linux (Debian/Ubuntu)
    ```bash
    wget https://github.com/goodtune/snoopy/releases/download/{{ .Tag }}/snoopy_{{ .Version }}_amd64.deb
    sudo apt install ./snoopy_{{ .Version }}_amd64.deb
    # Not enabled automatically; enable it for your user (or see the README)
    systemctl --user enable --now snoopy.service
    ```

    #### Binary Installation
    ```bash
    wget https://github.com/goodtune/snoopy/releases/download/{{ .Tag }}/snoopy_{{ .Version }}_Linux_x86_64.tar.gz
    tar -xzf snoopy_{{ .Version }}_Linux_x86_64.tar.gz
    sudo install -m 755 snoopy snoopy-attest /usr/bin/
    ```

    #### Supervised desktops (KProxy attestation)
    The packages also install `snoopy-attest`, a root system service that
    vouches to KProxy that the screen is being recorded. It is not enabled
    automatically; see `/usr/share/doc/snoopy/attestation.md`.
