version: 2

# There is no go.mod at the repository root (the Go code lives in server/),
# so the project name cannot be inferred.
project_name: snoopy

# Main build configuration
builds:
  - id: snoopy
    dir: server
    main: .
    binary: snoopy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    targets:
      - linux_amd64
      - linux_arm64

# Archive configuration for GitHub releases
archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md
      - src: server/snoopy.service
        strip_parent: true
      - src: server/snoopy.conf.example
        strip_parent: true
      - assets/snoopy-500.jpg

# Linux packages (RPM and Debian)
nfpms:
  - id: snoopy-packages
    package_name: snoopy
    ids:
      - snoopy
    # e.g. snoopy-0.1.0-1.x86_64.rpm and snoopy_0.1.0_amd64.deb
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: GoodTune
    homepage: https://github.com/goodtune/snoopy
    maintainer: Gary Reynolds <gary@touch.asn.au>
    description: |
      Snoopy - Continuous screen recording and web-based streaming for GNOME-based Linux systems.
      Provides automated screencast recording in segments by interfacing with GNOME Shell's
      screencast D-Bus API, with real-time web streaming via HTTP Server-Sent Events (SSE).
    license: MIT
    section: utils
    formats:
      - rpm
      - deb
    bindir: /usr/bin

    # Package contents
    contents:
      # Binary (already included by default in bindir)

      # Systemd service file
      - src: server/snoopy.service
        dst: /usr/lib/systemd/user/snoopy.service
        file_info:
          mode: 0644

      # Branding asset
      - src: assets/snoopy-500.jpg
        dst: /usr/share/snoopy/assets/snoopy-500.jpg
        file_info:
          mode: 0644

      # Example configuration (copy to /etc/snoopy/snoopy.conf or
      # ~/.config/snoopy/snoopy.conf)
      - src: server/snoopy.conf.example
        dst: /usr/share/doc/snoopy/snoopy.conf.example
        file_info:
          mode: 0644

      # Documentation
      - src: README.md
        dst: /usr/share/doc/snoopy/README.md
        file_info:
          mode: 0644

      # License
      - src: LICENSE
        dst: /usr/share/licenses/snoopy/LICENSE
        file_info:
          mode: 0644

    # Scripts
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh

    # Dependencies
    recommends:
      - ffmpeg

    # RPM-specific
    rpm:
      summary: Continuous screen recording with web streaming for GNOME
      compression: lzma

# Checksum configuration
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Snapshot configuration for non-tagged builds
snapshot:
  version_template: "{{ .Version }}-next"

# Changelog configuration
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Security Updates'
      regexp: '^.*?sec(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Performance Improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999

# GitHub release configuration
release:
  github:
    owner: goodtune
    name: snoopy
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## Snoopy {{ .Version }}

    Continuous screen recording and web-based streaming for GNOME-based Linux systems.

    ### Installation

    #### Linux (RPM-based: RHEL/CentOS/Fedora)
    ```bash
    sudo dnf install https://github.com/goodtune/snoopy/releases/download/{{ .Tag }}/snoopy-{{ .Version }}-1.x86_64.rpm
    # Not enabled automatically; enable it for your user (or see the README)
    systemctl --user enable --now snoopy.service
    ```

    #### Linux (Debian/Ubuntu)
    ```bash
    wget https://github.com/goodtune/snoopy/releases/download/{{ .Tag }}/snoopy_{{ .Version }}_amd64.deb
    sudo apt install ./snoopy_{{ .Version }}_amd64.deb
    # Not enabled automatically; enable it for your user (or see the README)
    systemctl --user enable --now snoopy.service
    ```

    #### Binary Installation
    ```bash
    wget https://github.com/goodtune/snoopy/releases/download/{{ .Tag }}/snoopy_{{ .Version }}_Linux_x86_64.tar.gz
    tar -xzf snoopy_{{ .Version }}_Linux_x86_64.tar.gz
    sudo install -m 755 snoopy /usr/bin/
    ```

    ### What's Changed
  footer: |
    **Full Changelog**: https://github.com/goodtune/snoopy/compare/{{ .PreviousTag }}...{{ .Tag }}
