# Static analysis configuration. Run with `flutter analyze`.
# Lint reference: https://dart.dev/lints

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - macos/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - prefer_final_locals
    - unawaited_futures
